services:
  - type: web
    name: railguard-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: CORS_ORIGINS
        value: https://railguard-ai-popf.onrender.com,https://railguard-ai-liard.vercel.app,https://railguard-ai.vercel.app,https://railguard-9ih8xi8fb-shreya-shuklas-projects-8a138f10.vercel.app,http://localhost:5173,http://localhost:3000

